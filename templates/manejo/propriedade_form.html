{% extends "base.html" %}
{% block hero_title %}{% if form.instance.pk %}Editar{% else %}Nova{% endif %} propriedade{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <div><h2 class="card-title">{% if form.instance.pk %}Editar{% else %}Nova{% endif %} propriedade</h2></div>
  </div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="btn" type="submit">Salvar</button>
      <a class="btn secondary" href="{% url 'manejo_propriedade_list' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
